<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrissur Coastal Beach Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
  onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
:root{
  --bg:#0a141d; --panel:#101e2a; --panel2:#162735; --line:#24394b;
  --text:#e8f1f7; --muted:#8fa5b6; --teal:#22d3ee; --amber:#f59e0b;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 18px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:grid;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;font-weight:700;letter-spacing:.2px}
.count{color:var(--muted);font-size:.85rem}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#search{flex:1 1 220px;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:.95rem}
#search::placeholder{color:var(--muted)}
#search:focus,.chip:focus-visible,.card:focus-visible,.tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 14px;border-radius:999px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[data-f="Popular"] i{background:var(--teal)}
.chip[data-f="Underrated"] i{background:var(--amber)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs{display:none;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tab{flex:1;background:var(--bg);color:var(--muted);border:0;padding:9px;font-size:.9rem;cursor:pointer}
.tab.on{background:var(--teal);color:#04222a;font-weight:600}
main{flex:1;display:grid;grid-template-columns:380px 1fr;min-height:0}
#list{overflow-y:auto;padding:14px;display:grid;gap:10px;align-content:start;background:var(--bg);border-right:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.card:hover,.card.active{background:var(--panel2);border-color:var(--c)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{font-size:1rem;font-weight:600}
.badge{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;color:#06151c;background:var(--c);white-space:nowrap}
.meta{margin:7px 0 9px;display:grid;gap:2px;font-size:.85rem;line-height:1.4}
.meta .pan{color:var(--text);font-weight:600}
.meta .loc{color:var(--muted)}
.gm{color:var(--c);font-size:.88rem;font-weight:600;text-decoration:none}
.gm:hover{text-decoration:underline}
.empty{color:var(--muted);padding:24px 8px;text-align:center;line-height:1.5}
#map{height:100%;width:100%;background:#cfe3f2}
.maperr{padding:30px;color:#0a141d;font-weight:600;line-height:1.5}
.T{--c:var(--teal)} .A{--c:var(--amber)}
.bm{display:flex;align-items:center;width:max-content;cursor:pointer}
.bm svg{flex:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));transition:transform .15s}
.bm .lbl{margin-left:5px;background:var(--bg);color:var(--text);font:600 12px/1 "Segoe UI",system-ui,sans-serif;padding:5px 9px;border-radius:999px;border:2px solid var(--c);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.bm.active svg{transform:scale(1.35)}
.bm.active .lbl{background:var(--c);color:#06151c}
.leaflet-marker-icon.bm-wrap{background:none;border:0}
.dl-wrap{background:none;border:0;pointer-events:none}
.dl{width:max-content;transform:translate(-50%,-50%);text-align:center;color:#9f1239;font:700 24px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:3px;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 8px #fff}
.dl small{display:block;margin-top:4px;font-size:11px;font-weight:600;letter-spacing:2px;color:#be123c}
.leaflet-tooltip.pt{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;font:600 12px "Segoe UI",system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.leaflet-tooltip.pt:before{display:none}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border-radius:12px;border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:14px 16px;min-width:210px}
.pop h3{font-size:1.02rem;margin-bottom:6px}
.pop .meta{margin:8px 0 12px}
.pop .gm{display:inline-block;background:var(--c);color:#06151c;padding:8px 12px;border-radius:8px}
.leaflet-container a.gm{color:#06151c}
.leaflet-container a.gm:hover{text-decoration:none;filter:brightness(1.1)}
@media (max-width:760px){
  .tabs{display:flex}
  main{display:block;position:relative}
  #list,#map{position:absolute;inset:0;height:100%;border:0}
  body[data-view="map"] #list{display:none}
  body[data-view="list"] #map{visibility:hidden}
  .chips{flex-wrap:wrap}
  .dl{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</header>

    panGroup.addLayer(g);
  });
  var distLL = DIST.map(function(r){ return r.map(function(c){ return [c[1],c[0]]; }); });
  var distGroup = L.layerGroup([
    L.polygon(distLL,{color:"#ffffff",weight:7,opacity:.9,fill:false,interactive:false}),
    L.polygon(distLL,{color:"#be123c",weight:3.5,opacity:1,fill:false,interactive:false})
  ]);
  var dlabel = L.marker([10.625,76.20],{
    icon:L.divIcon({className:"dl-wrap",html:'<div class="dl">Thrissur<small>DISTRICT</small></div>',iconSize:[0,0]}),
    interactive:false,keyboard:false,zIndexOffset:-1000
  });
  distGroup.addLayer(dlabel);
  panGroup.addTo(map);
  distGroup.addTo(map);
  L.control.layers(null,{
    "Thrissur district border":distGroup,
    "Panchayat boundaries":panGroup
  },{collapsed:matchMedia("(max-width:760px)").matches,position:"topright"}).addTo(map);

  /* ---------- Beaches ---------- */
  var layer = L.layerGroup().addTo(map);
  var markers = {};
  var filter = "All", query = "", activeId = null, popTimer = null;

  function icon(b){
    var c = COLORS[b.cat];
    return L.divIcon({
      className:"bm-wrap",
      html:'<div class="bm '+cls(b)+'" data-id="'+b.id+'"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="'+c+'" stroke="#fff" stroke-width="2.5"/><circle cx="11" cy="11" r="3" fill="#0a141d"/></svg><span class="lbl">'+esc(b.name)+'</span></div>',
      iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-14]
    });
  }
  function popupHtml(b){
    return '<div class="pop '+cls(b)+'"><h3>'+esc(b.name)+'</h3>'+
      '<span class="badge" style="background:'+COLORS[b.cat]+';color:#06151c;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px">'+b.cat+'</span>'+
      metaHtml(b)+
      '<a class="gm" href="'+gmap(b)+'" target="_blank" rel="noopener">📍 View on Google Maps</a></div>';
  }

  BEACHES.forEach(function(b){
    var m = L.marker([b.lat,b.lng],{icon:icon(b),title:b.name,riseOnHover:true});
    m.bindPopup(popupHtml(b));
    m.on("click", function(){ setActive(b.id); });
    m.on("popupclose", function(){ if (activeId === b.id) setActive(null); });
    markers[b.id] = m;
  });

  function visible(){
    var q = query.trim().toLowerCase();
    return BEACHES.filter(function(b){
      return (filter === "All" || b.cat === filter) &&
        (!q || (b.name+" "+b.area+" "+b.panchayat+" "+b.cat).toLowerCase().indexOf(q) !== -1);
    });
  }
  function setActive(id){
    activeId = id;
    document.querySelectorAll(".card").forEach(function(c){ c.classList.toggle("active", +c.dataset.id === id); });
    document.querySelectorAll(".bm").forEach(function(e){ e.classList.toggle("active", +e.dataset.id === id); });
    Object.keys(markers).forEach(function(k){ markers[k].setZIndexOffset(+k === id ? 1000 : 0); });
    Object.keys(polys).forEach(function(k){ polys[k].setStyle(BASE); });
    var b = BEACHES.filter(function(x){ return x.id === id; })[0];
    if (b && polys[b.poly]) polys[b.poly].setStyle(HI);
  }
  function fit(list){
    if (!list.length) return;
    map.fitBounds(L.latLngBounds(list.map(function(b){ return [b.lat,b.lng]; })),
      {paddingTopLeft:[40,40],paddingBottomRight:[170,40],maxZoom:13});
  }
  function showView(v){
    if (!matchMedia("(max-width:760px)").matches) return;
    document.body.dataset.view = v;
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.v === v); });
    if (v === "map") setTimeout(function(){ map.invalidateSize(); }, 60);
  }
  function goTo(id){
    var b = BEACHES.filter(function(x){ return x.id === id; })[0];
    showView("map");
    setActive(id);
    clearTimeout(popTimer);
    setTimeout(function(){
      map.invalidateSize();
      map.flyTo([b.lat,b.lng], Math.max(map.getZoom(),14), {duration:.9});
      popTimer = setTimeout(function(){ markers[id].openPopup(); }, 1000);
    }, 80);
  }

  function render(refit){
    var list = visible();
    layer.clearLayers();
    list.forEach(function(b){ layer.addLayer(markers[b.id]); });
    document.getElementById("count").textContent = list.length + " of " + BEACHES.length + " beaches";
    var el = document.getElementById("list");
    el.innerHTML = list.length ? list.map(function(b){
      return '<article class="card '+cls(b)+'" data-id="'+b.id+'" tabindex="0">'+
        '<div class="card-top"><h2>'+esc(b.name)+'</h2><span class="badge">'+b.cat+'</span></div>'+
        metaHtml(b)+
        '<a class="gm" href="'+gmap(b)+'" target="_blank" rel="noopener">📍 View on Google Maps</a></article>';
    }).join("") : '<div class="empty">No beaches match your search. Clear the search or choose All.</div>';

    el.querySelectorAll(".card").forEach(function(card){
      var id = +card.dataset.id;
      card.addEventListener("mouseenter", function(){ setActive(id); });
      card.addEventListener("mouseleave", function(){ if (!markers[id].isPopupOpen()) setActive(null); });
      card.addEventListener("focus", function(){ setActive(id); });
      card.addEventListener("click", function(e){ if (!e.target.closest("a")) goTo(id); });
      card.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goTo(id); }
      });
    });
    if (refit) fit(list);
    if (activeId) setActive(activeId);
  }

  document.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      filter = c.dataset.f;
      document.querySelectorAll(".chip").forEach(function(x){ x.classList.toggle("on", x === c); });
      render(true);
    });
  });
  document.getElementById("search").addEventListener("input", function(e){ query = e.target.value; render(true); });
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      showView(t.dataset.v);
      if (t.dataset.v === "map") setTimeout(function(){ fit(visible()); }, 120);
    });
  });
  window.addEventListener("resize", function(){ map.invalidateSize(); });

  map.setView([10.43,76.07],10);
  render(false);
  map.invalidateSize();
  fit(BEACHES);
}
</script>
</body>
</html>
