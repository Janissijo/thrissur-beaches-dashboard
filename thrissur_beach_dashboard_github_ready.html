<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrissur District Beach Administration</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS for Map (via cdnjs) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzEzvAeZzzfO/qQ3b8k4R4b9HwpsIqK/N06XwN6T/8Vq46g42H+vI5B4T3y3+6x1Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* Ensure the map container takes full available height */
        #map {
            height: 100%;
            width: 100%;
            z-index: 10;
        }
        
        /* Custom scrollbar for sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased overflow-hidden">

    <div class="flex flex-col md:flex-row h-screen w-full">
        
        <!-- Sidebar -->
        <div class="w-full md:w-1/3 lg:w-1/4 bg-white shadow-xl flex flex-col z-20 h-1/3 md:h-full">
            
            <!-- Header -->
            <div class="p-5 border-b border-gray-200 bg-blue-900 text-white">
                <h1 class="text-xl font-bold tracking-wide">Thrissur Coastal Admin</h1>
                <p class="text-sm text-blue-200 mt-1">District Beach Dashboard</p>
            </div>

            <!-- Search / Filter (Visual only for layout completeness) -->
            <div class="p-3 border-b border-gray-200 bg-gray-50">
                <input type="text" placeholder="Search beaches..." class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
            </div>

            <!-- Beach List -->
            <div id="beach-list" class="flex-1 overflow-y-auto">
                <!-- List items will be injected here by JavaScript -->
            </div>
            
            <!-- Footer -->
            <div class="p-3 border-t border-gray-200 bg-gray-50 text-xs text-gray-500 text-center">
                DTPC & District Administration Data
            </div>
        </div>

        <!-- Map Container -->
        <div class="w-full md:w-2/3 lg:w-3/4 h-2/3 md:h-full relative z-10">
            <div id="map"></div>
        </div>

    </div>

    <!-- Leaflet JS (via cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHqxNdZVsy98iE5wzF2E0c+O7Z9A7j2X2b30z5q6zV7+99Xw4z9O3q3z+X5y3x4z5q2X1v3Z3Q8=" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
        window.addEventListener('load', () => {
            // Data payload for Thrissur Beaches requested
            const beaches = [
                {
                    id: 'chavakkad',
                    name: 'Chavakkad Beach',
                    lat: 10.5847,
                    lng: 75.9863,
                    type: 'DTPC Major Beach',
                    description: 'Famous for the Azhimukham (river-sea confluence). Serves as a major hub for traditional fishing and features a floating bridge.'
                },
                {
                    id: 'snehatheeram',
                    name: 'Snehatheeram Beach',
                    lat: 10.4241,
                    lng: 76.0828,
                    type: 'DTPC Major Beach',
                    description: 'Highly maintained family tourism spot with parks, paved walkways, and regular cultural festivals.'
                },
                {
                    id: 'munakkal',
                    name: 'Munakkal Beach',
                    lat: 10.1873,
                    lng: 76.1666,
                    type: 'DTPC Major Beach',
                    description: 'The largest beach in the district, developed under a tidal wave restructuring program in Azhikode.'
                },
                {
                    id: 'nattika',
                    name: 'Nattika Beach',
                    lat: 10.4077,
                    lng: 76.0963,
                    type: 'DTPC Major Beach',
                    description: 'Tranquil environment tailored toward wellness tourism, anchoring prominent Ayurvedic centers.'
                },
                {
                    id: 'vadanapally',
                    name: 'Vadanapally Beach',
                    lat: 10.4633,
                    lng: 76.0645,
                    type: 'Local Village Beach',
                    description: 'A serene coastal village beach linked closely with inland backwaters, surrounded by coconut palm trees.'
                },
                {
                    id: 'perinjanam',
                    name: 'Perinjanam Beach',
                    lat: 10.3117,
                    lng: 76.1402,
                    type: 'Local Village Beach',
                    description: 'Quiet, remote coastal stretch known for exceptionally clean shores scattered with seashells.'
                },
                {
                    id: 'chilanka',
                    name: 'Chilanka Beach',
                    lat: 10.4502,
                    lng: 76.0711,
                    type: 'Local Village Beach',
                    description: 'A peaceful coastal area located near Vadanappally Thampankadavu. Serves as a calm relaxation spot.'
                },
                {
                    id: 'valapad',
                    name: 'Valapad Beach',
                    lat: 10.3800,
                    lng: 76.1130,
                    type: 'Local Village Beach',
                    description: 'Wide sandy shoreline preserving traditional village life. Remains largely unexplored by heavy tourism.'
                }
            ];

            // Initialize Map
            // Centered around the middle of the Thrissur coastline
            const map = L.map('map').setView([10.4000, 76.0800], 10);

            // Add Esri World Street Map tiles to fix the OSM usage policy block
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
            }).addTo(map);

            // Store markers to access them from the sidebar
            const markers = {};
            const beachListEl = document.getElementById('beach-list');

            // Loop through data to create markers and sidebar items
            beaches.forEach(beach => {
                // Create Map Marker
                const marker = L.marker([beach.lat, beach.lng]).addTo(map);
                
                const badgeClass = beach.type.includes('DTPC') 
                    ? 'bg-blue-100 text-blue-800 border-blue-200' 
                    : 'bg-teal-100 text-teal-800 border-teal-200';

                const popupContent = `
                    <div class="p-1 min-w-[200px]">
                        <h3 class="font-bold text-base mb-1 text-gray-900">${beach.name}</h3>
                        <span class="inline-block px-2 py-1 text-xs font-semibold rounded border ${badgeClass} mb-2">
                            ${beach.type}
                        </span>
                        <p class="text-sm text-gray-600 leading-relaxed">${beach.description}</p>
                        <div class="mt-3 pt-2 border-t border-gray-200 text-xs text-gray-500">
                            Lat: ${beach.lat.toFixed(4)} <br> Lng: ${beach.lng.toFixed(4)}
                        </div>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markers[beach.id] = marker;

                // Create Sidebar List Item
                const listItem = document.createElement('div');
                listItem.className = 'p-4 border-b border-gray-100 hover:bg-blue-50 cursor-pointer transition-colors duration-200 flex flex-col gap-1';
                
                listItem.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h3 class="font-semibold text-gray-800">${beach.name}</h3>
                    </div>
                    <span class="text-xs font-medium text-gray-500">${beach.type}</span>
                `;

                // Add Click Event to List Item
                listItem.addEventListener('click', () => {
                    map.flyTo([beach.lat, beach.lng], 14, {
                        animate: true,
                        duration: 1.5
                    });
                    
                    setTimeout(() => {
                        marker.openPopup();
                    }, 500);

                    document.querySelectorAll('#beach-list > div').forEach(el => el.classList.remove('bg-blue-50', 'border-l-4', 'border-blue-600'));
                    listItem.classList.add('bg-blue-50', 'border-l-4', 'border-blue-600');
                });

                beachListEl.appendChild(listItem);
            });
            
        }); // End of window load listener
    </script>
</body>
</html>
